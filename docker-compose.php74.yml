# Временный запуск текущего сайта (Laravel 8) на PHP 7.4.
# Значения ${DB_*} берутся из .env проекта.
name: konstantindev-php74

services:
  app:
    build: docker/php74
    ports:
      - "8074:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      APP_URL: http://localhost:8074
      APP_DEBUG: "true"
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.6
    ports:
      - "3307:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      # при первом запуске (пустой том) импортирует database/dump/*.sql
      - ./database/dump:/docker-entrypoint-initdb.d:ro
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
